# Render "Blueprint" - lets you deploy with New > Blueprint instead of
# clicking through every setting by hand. See DEPLOY.md for the full steps.
services:
  - type: web
    name: worksheet-remix
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BETA_ACCESS_CODE
        sync: false
      - key: RATE_LIMIT_PER_DAY
        value: "15"
      - key: SEN_WORKSHEETS_MODEL
        value: "claude-sonnet-4-5"
